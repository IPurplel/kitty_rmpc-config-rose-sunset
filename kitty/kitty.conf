# Rose Room — Sunset Rose / Kitty 0.47.1
# Known earlier base settings plus the last selected override.
# Color definitions live in the relative include below.

font_family JetBrains Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 17.7
disable_ligatures always
modify_font cell_height 120%
background_opacity 0.55
dynamic_background_opacity yes
background_image none
cursor_shape underline
cursor_blink_interval 0
shell_integration no-cursor
window_padding_width 15
single_window_padding_width -1
window_margin_width 0
single_window_margin_width -1
window_border_width 1.5pt
draw_minimal_borders no
draw_window_borders_for_single_window yes
hide_window_decorations titlebar-only
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_bar_style separator
tab_bar_align left
tab_bar_margin_width 18
tab_bar_margin_height 12 12
tab_separator " │ "
tab_title_max_length 26
tab_title_template " {index}  {title[:8] + '…' + title[-9:] if title[18:] else title}{fmt.fg._c74d82}{bell_symbol}{activity_symbol}{fmt.fg.tab} "
active_tab_title_template none
active_tab_font_style bold
inactive_tab_font_style normal
tab_activity_symbol " ●"
tab_bar_show_new_tab_button no
scrollback_lines 10000

include themes/sunset-rose.conf
